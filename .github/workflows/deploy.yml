name: Build & Deploy

on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker stop korea-bot || true
          docker rm korea-bot || true
          docker run -d --name korea-bot --restart unless-stopped \
            --network host \
            --env-file ~/korea-bot/.env \
            -v ~/korea-bot/credentials.json:/app/credentials.json:ro \
            ghcr.io/${{ github.repository }}:latest
