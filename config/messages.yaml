messages:
  choose_language:
    en: "Welcome! Please choose your language:"
    ko: "환영합니다! 언어를 선택해 주세요:"
    ru: "Добро пожаловать! Пожалуйста, выберите язык:"

  welcome:
    en: |
      Welcome to Study Way! 🇰🇷

      Our goal is to help students like you to fulfill their dream of studying in South Korea.
      I'll ask you a few quick questions to understand your needs — it takes less than 2 minutes.

      Type /cancel at any time to stop.
    ko: |
      스터디 웨이에 오신 것을 환영합니다! 🇰🇷

      저희는 한국 유학을 원하는 학생들을 돕고 있습니다.
      몇 가지 간단한 질문을 드리겠습니다 — 2분도 걸리지 않습니다.

      언제든지 /cancel을 입력하면 중단할 수 있습니다.
    ru: |
      Добро пожаловать в Study Way! 🇰🇷

      Наша главная цель — помочь студентам исполнить их мечту и начать учиться в Южной Корее.
      Пожалуйста, ответьте на несколько коротких вопросов — это займёт менее 2 минут. Это поможет нам подобрать Вам наиболее подходящего консультанта.

      Введите /cancel в любой момент, чтобы остановиться.

  ask_name:
    en: "What is your full name?"
    ko: "성함이 어떻게 되세요?"
    ru: "Как Вас зовут? (полное имя)"

  ask_age:
    en: "How old are you?"
    ko: "나이가 어떻게 되세요?"
    ru: "Сколько Вам лет?"

  ask_country:
    en: "Which country are you currently living in?"
    ko: "현재 어느 나라에 살고 계세요?"
    ru: "В какой стране Вы сейчас проживаете?"

  ask_education:
    en: "What is your current education level?"
    ko: "현재 학력이 어떻게 되세요?"
    ru: "Какой у Вас текущий уровень образования (последний полученный диплом)?"

  ask_field:
    en: "What field of study are you interested in?\n(e.g. Computer Science, Business, Korean Language, Design...)"
    ko: "어떤 분야를 공부하고 싶으세요?\n(예: 컴퓨터 공학, 경영학, 한국어, 디자인...)"
    ru: "Какой Ваш основной интерес в обучении?\n(например: информатика, бизнес, корейский язык, дизайн...)"

  ask_arrival:
    en: "When do you plan to come to Korea?"
    ko: "언제 한국에 오실 계획인가요?"
    ru: "Когда Вы планируете начать учебу в Корее?"

  ask_budget:
    en: "What is your monthly budget (in USD)?"
    ko: "월 예산이 어떻게 되세요? (USD 기준)"
    ru: "Какой у Вас бюджет на обучение(в USD)?"

  ask_preferences:
    en: "Please, specify social media of preference for contact."
    ko: "원활한 상담을 위해 선호하시는 메신저를 알려주세요."
    ru: "Пожалуйста, укажите предпочтительный мессенджер для связи."

  ask_contact:
    Telegram:
      en: "What is your Telegram username? (e.g. @username)"
      ko: "텔레그램 사용자명을 알려주세요. (예: @username)"
      ru: "Укажите ваш Telegram username (например: @username)"
    WhatsApp:
      en: "What is your WhatsApp number? (e.g. +1 234 567 8900)"
      ko: "WhatsApp 번호를 알려주세요. (예: +1 234 567 8900)"
      ru: "Укажите ваш номер WhatsApp (например: +1 234 567 8900)"
    Instagram:
      en: "What is your Instagram username? (e.g. @username)"
      ko: "인스타그램 사용자명을 알려주세요. (예: @username)"
      ru: "Укажите ваш Instagram username (например: @username)"
    VK:
      en: "What is your VK username or profile link?"
      ko: "VK 사용자명 또는 프로필 링크를 알려주세요."
      ru: "Укажите ваш VK username или ссылку на профиль"

  invalid_contact:
    en: "Please enter a valid contact (at least 2 characters)."
    ko: "올바른 연락처를 입력해 주세요 (최소 2자 이상)."
    ru: "Пожалуйста, введите корректные контактные данные (не менее 2 символов)."

  summary_header:
    en: "Here is a summary of your answers. Is everything correct?"
    ko: "입력하신 내용을 확인해 주세요. 모든 정보가 정확한가요?"
    ru: "Вот сводка ваших ответов. Всё верно?"

  thank_you:
    en: |
      Thank you! 🙏
      Our team will review your information and contact you within 48 hours.
      We look forward to helping you start your Korean adventure! 🇰🇷
    ko: |
      감사합니다! 🙏
      저희 팀이 48시간 이내에 연락드릴 예정입니다.
      여러분의 한국 유학을 도울 수 있기를 기대합니다! 🇰🇷
    ru: |
      Спасибо! 🙏
      Наша команда свяжется с вами в течение 48 часов.
      Начните Ваше корейское приключение со Study Way! 🇰🇷

  cancelled:
    en: "Registration cancelled. Type /start whenever you want to begin again."
    ko: "등록이 취소되었습니다. 다시 시작하려면 /start를 입력하세요."
    ru: "Регистрация отменена. Введите /start, когда захотите начать снова."

  invalid_name:
    en: "Please enter your full name (at least 2 characters)."
    ko: "성함을 입력해 주세요 (최소 2자 이상)."
    ru: "Пожалуйста, введите своё полное имя (не менее 2 символов)."

  invalid_age:
    en: "Please enter a valid age (a number between 10 and 80)."
    ko: "올바른 나이를 입력해 주세요 (10~80 사이의 숫자)."
    ru: "Пожалуйста, введите корректный возраст (число от 10 до 80)."

  invalid_country:
    en: "Please enter your country name."
    ko: "국가명을 입력해 주세요."
    ru: "Пожалуйста, введите корректное название страны."

  invalid_email:
    en: "That doesn't look like a valid email. Please try again (e.g. name@example.com)."
    ko: "유효하지 않은 이메일 형식입니다. 다시 시도해 주세요 (예: name@example.com)."
    ru: "Похоже, это неверный адрес электронной почты. Попробуйте ещё раз (например: name@example.com)."

